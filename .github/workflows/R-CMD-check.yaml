name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: devel}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_CRAN_INCOMING_: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'

      - name: Print R CMD check log
        if: always()
        shell: Rscript {0}
        run: |
          logs <- list.files(".", pattern = "00check\\.log$", recursive = TRUE, full.names = TRUE)
          if (!length(logs)) quit(status = 0L)
          for (log in logs) {
            cat("\n===== ", log, " =====\n", sep = "")
            cat(readLines(log, warn = FALSE), sep = "\n")
            cat("\n")

  manual:
    name: Linux manual
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Build reference manual
        run: R CMD Rd2pdf --output=tradesimr-manual.pdf man
          }
